<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - Affichage Collège</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #F5F5F5;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
}

.login-container {
    background: white;
    border: 2px solid #1E3A8A;
    padding: 40px;
    width: 90%;
    max-width: 450px;
}

.logo-section {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    height: 80px;
    margin-bottom: 20px;
}

h1 {
    color: #1E3A8A;
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    font-size: 15px;
}

.login-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.tab-btn {
    flex: 1;
    padding: 12px;
    background: white;
    border: 2px solid #CCC;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

.tab-btn.active {
    background: #1E3A8A;
    color: white;
    border-color: #1E3A8A;
}

.form-group {
    margin-bottom: 25px;
}

.form-label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    color: #333;
}

.form-input {
    width: 100%;
    padding: 12px;
    border: 2px solid #CCC;
    font-size: 16px;
}

.form-input:focus {
    outline: none;
    border-color: #1E3A8A;
}

.btn-login {
    width: 100%;
    padding: 15px;
    background: #1E3A8A;
    color: white;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.btn-login:hover {
    background: #2563EB;
}

.error-message {
    background: #FEE2E2;
    color: #DC2626;
    padding: 12px;
    margin-bottom: 20px;
    display: none;
    border: 2px solid #DC2626;
}

.error-message.show {
    display: block;
}

.info-box {
    background: #F0F9FF;
    border: 2px solid #1E3A8A;
    padding: 12px;
    margin-bottom: 20px;
    font-size: 13px;
    color: #1E3A8A;
}
</style>
</head>
<body>

<div class="login-container">
    <div class="logo-section">
        <img class="logo" src="https://image-parcours.copainsdavant.com/image/750/2089415238/4294409.jpg" alt="Logo">
        <h1>Connexion</h1>
        <p class="subtitle">Éditeur d'Affichage Collège</p>
    </div>
    
    <div class="login-tabs">
        <button class="tab-btn active" onclick="switchTab('editor')">Éditeur</button>
        <button class="tab-btn" onclick="switchTab('admin')">Administrateur</button>
    </div>
    
    <div class="info-box" id="infoBox">
        Accès à l'éditeur de slides
    </div>
    
    <div class="error-message" id="errorMessage"></div>
    
    <form onsubmit="login(event)">
        <div class="form-group">
            <label class="form-label">Mot de passe</label>
            <input type="password" id="password" class="form-input" placeholder="Entrez le mot de passe" required autofocus>
        </div>
        
        <button type="submit" class="btn-login" id="loginBtn">Se connecter</button>
    </form>
</div>

<script>
let currentMode = 'editor';

function switchTab(mode) {
    currentMode = mode;
    
    // Update tabs
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    // Update info box
    const infoBox = document.getElementById('infoBox');
    if (mode === 'admin') {
        infoBox.textContent = 'Accès administration : gestion des mots de passe et mise à jour du code';
    } else {
        infoBox.textContent = 'Accès à l\'éditeur de slides';
    }
    
    // Clear password
    document.getElementById('password').value = '';
}

function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = message;
    errorDiv.classList.add('show');
    
    setTimeout(() => {
        errorDiv.classList.remove('show');
    }, 5000);
}

function login(event) {
    event.preventDefault();
    
    const password = document.getElementById('password').value;
    const endpoint = currentMode === 'admin' ? '/api/admin_login' : '/api/login';
    
    fetch(endpoint, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: password})
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'ok') {
            if (currentMode === 'admin') {
                window.location.href = '/admin';
            } else {
                window.location.href = '/';
            }
        } else {
            showError(currentMode === 'admin' ? 'Mot de passe admin incorrect' : 'Mot de passe incorrect');
            document.getElementById('password').value = '';
        }
    })
    .catch(() => {
        showError('Erreur de connexion');
    });
}
</script>

</body>
</html>
